# Single source of truth for the Rust toolchain (rustc / cargo / rustfmt / clippy).
# mise reads this via idiomatic_version_file_enable_tools = ["rust"].
# profile = "minimal" keeps CI/local installs light (no rust-docs);
# rustfmt/clippy are added explicitly because minimal does not include them.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
