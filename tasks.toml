# mise tasks for ReadyType (Tauri + React)
# Run with: mise run <task>
# Paths: see [env] in .mise.toml (TAURI_APP_PATH / TAURI_FRONTEND_PATH)
# Rust toolchain: see rust-toolchain.toml
# Naming: <package>:<role> (e.g. react-ui:lint, rust-native:format)

[install]
description = "Install frontend dependencies"
dir = "tauri-desktop/react-ui"
run = "pnpm install"

[dev]
description = "Start Tauri development (Vite + Rust)"
dir = "tauri-desktop/react-ui"
run = "pnpm tauri dev"

[build]
description = "Build the Tauri application"
dir = "tauri-desktop/react-ui"
run = "pnpm tauri build"

["react-ui:typecheck"]
description = "Type-check react-ui"
dir = "tauri-desktop/react-ui"
run = "pnpm typecheck"

["react-ui:test"]
description = "Run react-ui unit tests"
dir = "tauri-desktop/react-ui"
run = "pnpm test"

["react-ui:test:e2e"]
description = "Run Playwright E2E (Vite UI + invoke mocks)"
dir = "tauri-desktop/react-ui"
run = "pnpm test:e2e"

["react-ui:screenshots"]
description = "Capture diagnostic screenshots via Playwright"
dir = "tauri-desktop/react-ui"
run = "pnpm screenshots"

["react-ui:lint"]
description = "Lint & format-check react-ui"
dir = "tauri-desktop/react-ui"
run = "pnpm lint"

["react-ui:fix"]
description = "Auto-fix react-ui lint & format issues"
dir = "tauri-desktop/react-ui"
run = "pnpm fix"

["react-ui:format"]
description = "Format react-ui"
dir = "tauri-desktop/react-ui"
run = "pnpm format"

["rust-native:format"]
description = "Format rust-native"
dir = "tauri-desktop/rust-native"
run = "cargo fmt"

["rust-native:format:check"]
description = "Check rust-native formatting without writing"
dir = "tauri-desktop/rust-native"
run = "cargo fmt -- --check"

["rust-native:lint"]
description = "Lint rust-native"
dir = "tauri-desktop/rust-native"
run = "cargo clippy --all-targets -- -D warnings"
