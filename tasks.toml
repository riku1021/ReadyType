# mise tasks for ReadyType (Tauri + React)
# Run with: mise run <task>
# Paths: see [env] in .mise.toml (TAURI_APP_PATH / TAURI_FRONTEND_PATH)
# Rust toolchain: see rust-toolchain.toml
# Naming: <package>:<role> (e.g. react-ui:lint, rust-native:format)

[install]
description = "Install frontend dependencies"
dir = "tauri-desktop/react-ui"
run = "pnpm install"

[dev]
description = "Start Tauri development (Vite + Rust)"
dir = "tauri-desktop/react-ui"
run = """
if [ "$(uname -s)" = Darwin ]; then
  export APPLE_SIGNING_IDENTITY="$(bash ../rust-native/scripts/macos/ensure-signing-identity.sh)"
fi
pnpm tauri dev
"""

[build]
description = "Build the signed Tauri .app (macOS: skips flaky DMG)"
dir = "tauri-desktop/react-ui"
run = """
if [ "$(uname -s)" = Darwin ]; then
  export APPLE_SIGNING_IDENTITY="$(bash ../rust-native/scripts/macos/ensure-signing-identity.sh)"
  pnpm tauri build --bundles app
else
  pnpm tauri build
fi
"""

["build:dmg"]
description = "Build signed .app + DMG (unmount leftover /Volumes/dmg.* if hdiutil busy)"
dir = "tauri-desktop/react-ui"
run = """
if [ "$(uname -s)" = Darwin ]; then
  export APPLE_SIGNING_IDENTITY="$(bash ../rust-native/scripts/macos/ensure-signing-identity.sh)"
fi
pnpm tauri build --bundles app,dmg
"""

["install:app"]
description = "Copy built ReadyType.app into /Applications (macOS; run after build or build:dmg)"
run = """
if [ "$(uname -s)" != Darwin ]; then
  echo "install:app is macOS-only" >&2
  exit 1
fi
APP="tauri-desktop/rust-native/target/release/bundle/macos/ReadyType.app"
if [ ! -d "$APP" ]; then
  echo "Missing $APP — run: mise run build" >&2
  exit 1
fi
rm -rf /Applications/ReadyType.app
cp -R "$APP" /Applications/
echo "Installed /Applications/ReadyType.app"
"""

["react-ui:typecheck"]
description = "Type-check react-ui"
dir = "tauri-desktop/react-ui"
run = "pnpm typecheck"

["react-ui:test"]
description = "Run react-ui unit tests"
dir = "tauri-desktop/react-ui"
run = "pnpm test"

["react-ui:test:e2e"]
description = "Run Playwright E2E (Vite UI + invoke mocks)"
dir = "tauri-desktop/react-ui"
run = "pnpm test:e2e"

["react-ui:screenshots"]
description = "Capture diagnostic screenshots via Playwright"
dir = "tauri-desktop/react-ui"
run = "pnpm screenshots"

["react-ui:lint"]
description = "Lint & format-check react-ui"
dir = "tauri-desktop/react-ui"
run = "pnpm lint"

["react-ui:fix"]
description = "Auto-fix react-ui lint & format issues"
dir = "tauri-desktop/react-ui"
run = "pnpm fix"

["react-ui:format"]
description = "Format react-ui"
dir = "tauri-desktop/react-ui"
run = "pnpm format"

["rust-native:format"]
description = "Format rust-native"
dir = "tauri-desktop/rust-native"
run = "cargo fmt"

["rust-native:format:check"]
description = "Check rust-native formatting without writing"
dir = "tauri-desktop/rust-native"
run = "cargo fmt -- --check"

["rust-native:lint"]
description = "Lint rust-native"
dir = "tauri-desktop/rust-native"
run = "cargo clippy --all-targets -- -D warnings"

["astro-lp:typecheck"]
description = "Type-check astro-lp"
dir = "astro-lp"
run = "pnpm typecheck"

["astro-lp:lint"]
description = "Lint & format-check astro-lp"
dir = "astro-lp"
run = "pnpm lint"

["astro-lp:fix"]
description = "Auto-fix astro-lp lint & format issues"
dir = "astro-lp"
run = "pnpm fix"

["astro-lp:format"]
description = "Format astro-lp"
dir = "astro-lp"
run = "pnpm format"

["rust-native:lab-smoke"]
description = "macOS Lab input-source smoke (AppKit window on process main; needs AX)"
dir = "tauri-desktop/rust-native"
run = """
if [ "$(uname -s)" != Darwin ]; then
  echo "rust-native:lab-smoke is macOS-only" >&2
  exit 1
fi
cargo run --bin lab-smoke --features lab-smoke
"""
