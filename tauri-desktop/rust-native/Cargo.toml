[package]
name = "tauri-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# AppKit Lab smoke (process main + runloop). Not used by the Tauri app binary.
[features]
lab-smoke = []

[[bin]]
name = "lab-smoke"
path = "src/bin/lab_smoke.rs"
required-features = ["lab-smoke"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"

# LaunchAgent / registry login items (Windows / Linux). macOS uses SMAppService instead.
[target."cfg(not(target_os = \"macos\"))".dependencies]
tauri-plugin-autostart = "2"

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSAccessibilityProtocols", "NSApplication", "NSBitmapImageRep", "NSColor", "NSControl", "NSGraphics", "NSImage", "NSImageRep", "NSResponder", "NSRunningApplication", "NSText", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-core-foundation"] }
objc2-application-services = { version = "0.3.2", features = ["AXError", "AXUIElement", "AXValue", "HIServices", "libc"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFArray", "CFDate", "CFDictionary", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-services = { version = "0.3.2", features = ["AERegistry", "AppleEvents", "objc2"] }
objc2-foundation = { version = "0.3.2", features = ["NSAppleEventDescriptor", "NSAppleEventManager", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSNotification", "NSOperation", "NSString", "NSURL", "objc2-core-services"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService", "SMErrors", "objc2", "objc2-foundation"] }
# Quick Set をフルスクリーン Space 上に出すための NSPanel 化
tauri-nspanel = "2.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
