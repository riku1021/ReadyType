<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReadyType</title>
    <!-- モジュール評価前に data-theme を当て、表示直後の色ちらつきを防ぐ -->
    <script>
      (() => {
        var raw;
        var stored;
        var dark;
        var resolved;
        var bg;
        try {
          raw = localStorage.getItem("theme");
          stored = raw == null ? "system" : JSON.parse(raw);
          dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          resolved = dark ? "dark" : "light";
          // background.main.json（Panda / Rust window chrome と揃える）
          bg = dark ? "#222222" : "#F9F9F9";
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.backgroundColor = bg;
        } catch {
          /* localStorage / JSON が使えない環境ではシステム既定のまま */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
