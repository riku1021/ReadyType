# Desktop installers for macOS, Windows, and Linux.
#
# Tauri cannot cross-compile these bundles from macOS. Each job builds on a
# native runner and uploads the run's Artifacts. On main, the publish job also
# attaches three stable filenames to the GitHub Release `app-v<version>`
# (version is tauri.conf.json). The landing page links to
# `releases/latest/download/<filename>`.
#
# Filenames must match `desktopInstallerFile` in
# astro-lp/src/scripts/desktop-download.ts:
#   ReadyType-aarch64.dmg, ReadyType-x64-setup.exe, ReadyType-x64.AppImage
#
# macOS CI is ad-hoc signed (no Developer ID). Gatekeeper can block that DMG
# on other Macs until notarization is configured.
#
# Layout is sibling directories, so the CLI only finds them via
# TAURI_APP_PATH / TAURI_FRONTEND_PATH (see .mise.toml).
# https://v2.tauri.app/distribute/pipelines/github/

name: desktop-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop-build.yml
      - rust-toolchain.toml
      - tauri-desktop/**

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Host is Apple Silicon. No --target, so the macOS sidecar triple matches.
          # The public download is the DMG. Local `mise run build` still skips it.
          - platform: macos-latest
            args: --bundles dmg
          # Ubuntu 22.04 keeps the glibc baseline low enough for older distros.
          # https://v2.tauri.app/distribute/appimage/
          # Linux and Windows use tauri.conf.json targets: all (deb, rpm, appimage / nsis, msi).
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      TAURI_APP_PATH: ${{ github.workspace }}/tauri-desktop/rust-native
      TAURI_FRONTEND_PATH: ${{ github.workspace }}/tauri-desktop/react-ui

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # CI set from https://v2.tauri.app/distribute/pipelines/github/
          # Local-dev extras (build-essential, curl, libssl-dev, libxdo-dev) are omitted:
          # the ubuntu-22.04 image already has a compiler, curl, libssl-dev, and rpm.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: tauri-desktop/react-ui/pnpm-lock.yaml

      # @1.98.1 matches rust-toolchain.toml. @stable would ignore that pin.
      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-desktop/rust-native -> target

      - name: Install frontend dependencies
        working-directory: tauri-desktop/react-ui
        run: pnpm install --frozen-lockfile

      # CI has no Developer ID. Ad-hoc avoids a codesign failure on Apple Silicon.
      # Local builds keep using the ReadyType Code Signing identity via mise.
      # https://v2.tauri.app/distribute/sign/macos/
      - name: Use ad-hoc macOS code signing
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Prepare macOS input-source sidecar
        if: runner.os == 'macOS'
        working-directory: tauri-desktop/rust-native
        run: bash scripts/macos/prepare-tis-list-sidecar.sh --release

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-desktop/rust-native
          # Local CLI. The action splits this on spaces, so the path must not contain spaces.
          tauriScript: pnpm --dir ../react-ui exec tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

      # Stable names for releases/latest/download. The .app directory is not a
      # release asset (tauri-action would try to upload it as a file).
      - name: Stage installer for the GitHub Release
        shell: bash
        run: |
          set -eu
          shopt -s failglob
          mkdir -p release-assets
          case "${RUNNER_OS}" in
            macOS)
              cp tauri-desktop/rust-native/target/release/bundle/dmg/ReadyType_*.dmg \
                release-assets/ReadyType-aarch64.dmg
              ;;
            Linux)
              cp tauri-desktop/rust-native/target/release/bundle/appimage/ReadyType_*.AppImage \
                release-assets/ReadyType-x64.AppImage
              ;;
            Windows)
              cp tauri-desktop/rust-native/target/release/bundle/nsis/ReadyType_*-setup.exe \
                release-assets/ReadyType-x64-setup.exe
              ;;
            *)
              echo "Unsupported runner: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-installer-*
          merge-multiple: true
          path: release-assets

      # Push the tag before creating the release. A release whose target commit
      # changes .github/workflows and has no ref yet needs workflows:write, which
      # GITHUB_TOKEN cannot have (it 404s or 403s). The tag gives that commit a ref.
      # https://github.blog/changelog/2023-11-02-github-actions-enforcing-workflow-scope-when-creating-a-release/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="$(jq -r .version tauri-desktop/rust-native/tauri.conf.json)"
          tag="app-v${version}"
          title="ReadyType ${version}"
          notes="$(cat <<EOF
          デスクトップ版のインストーラです。

          - macOS（Apple Silicon）: ReadyType-aarch64.dmg
          - Windows: ReadyType-x64-setup.exe
          - Linux: ReadyType-x64.AppImage

          macOS の CI ビルドは ad-hoc 署名です。
          EOF
          )"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --clobber
            gh release edit "${tag}" --latest --title "${title}" --notes "${notes}"
          else
            gh release create "${tag}" release-assets/* --latest --title "${title}" --notes "${notes}"
          fi
