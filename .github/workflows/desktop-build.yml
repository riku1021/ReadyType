# Desktop installers for macOS, Windows, and Linux.
#
# Windows and Linux bundles are built on their own runners. Intel macOS is
# cross-compiled on the Apple Silicon runner. Each job uploads Artifacts.
# On main, the publish job also attaches the stable filenames below to the
# GitHub Release `app-v<version>` (version is tauri.conf.json). The landing
# page links to `releases/latest/download/<filename>`.
#
# Filenames must match `desktopInstallerFile` in
# astro-lp/src/scripts/desktop-download.ts:
#   ReadyType-aarch64.dmg, ReadyType-x64.dmg,
#   ReadyType-x64-setup.exe, ReadyType-x64.AppImage
#
# In-app updates also need the GitHub Actions secret
# `TAURI_SIGNING_PRIVATE_KEY` (contents of the minisign private key, no
# password). When it is set, each build signs updater artifacts and the
# publish job writes `latest.json` for
# `releases/latest/download/latest.json`. Without the secret, installers
# still publish and updater artifacts are skipped.
#
# macOS CI is ad-hoc signed (no Developer ID). Gatekeeper can block that DMG
# on other Macs until notarization is configured.
#
# Layout is sibling directories, so the CLI only finds them via
# TAURI_APP_PATH / TAURI_FRONTEND_PATH (see .mise.toml).
# https://v2.tauri.app/distribute/pipelines/github/

name: desktop-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop-build.yml
      - rust-toolchain.toml
      - tauri-desktop/**

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Macs are built on the Apple Silicon runner.
          # `--target` keeps the sidecar triple and the DMG arch in lockstep.
          # https://v2.tauri.app/distribute/pipelines/github/
          # The public download is the DMG. Local `mise run build` still skips it.
          - platform: macos-latest
            target: aarch64-apple-darwin
            installer: ReadyType-aarch64.dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            installer: ReadyType-x64.dmg
          # Ubuntu 22.04 keeps the glibc baseline low enough for older distros.
          # https://v2.tauri.app/distribute/appimage/
          # Linux and Windows use tauri.conf.json targets: all (deb, rpm, appimage / nsis, msi).
          - platform: ubuntu-22.04
            installer: ReadyType-x64.AppImage
          - platform: windows-latest
            installer: ReadyType-x64-setup.exe

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      TAURI_APP_PATH: ${{ github.workspace }}/tauri-desktop/rust-native
      TAURI_FRONTEND_PATH: ${{ github.workspace }}/tauri-desktop/react-ui
      TAURI_TARGET: ${{ matrix.target }}
      INSTALLER_NAME: ${{ matrix.installer }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # CI set from https://v2.tauri.app/distribute/pipelines/github/
          # Local-dev extras (build-essential, curl, libssl-dev, libxdo-dev) are omitted:
          # the ubuntu-22.04 image already has a compiler, curl, libssl-dev, and rpm.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: tauri-desktop/react-ui/pnpm-lock.yaml

      # @1.98.1 matches rust-toolchain.toml. @stable would ignore that pin.
      # Extra targets are only needed for the macOS cross builds.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-desktop/rust-native -> target
          key: ${{ matrix.target || matrix.platform }}

      - name: Install frontend dependencies
        working-directory: tauri-desktop/react-ui
        run: pnpm install --frozen-lockfile

      # CI has no Developer ID. Ad-hoc avoids a codesign failure on Apple Silicon.
      # Local builds keep using the ReadyType Code Signing identity via mise.
      # https://v2.tauri.app/distribute/sign/macos/
      - name: Use ad-hoc macOS code signing
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      # Updater bundles are signed only when the private key secret is present.
      # Local `mise run build` does not pass updater-artifacts.json, so it does
      # not need the key. https://v2.tauri.app/plugin/updater/
      - name: Select updater signing args
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -eu
          args=""
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            args="--config updater-artifacts.json"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is unset. Installers will be built without updater artifacts."
          fi
          if [ -n "${TAURI_TARGET}" ]; then
            if [ -n "${args}" ]; then
              args="${args} "
            fi
            args="${args}--target ${TAURI_TARGET} --bundles dmg"
          fi
          echo "TAURI_BUILD_ARGS=${args}" >> "$GITHUB_ENV"

      # macOS sidecar is prepared by scripts/macos/dev-runner.sh, which receives
      # this --target. A separate prepare step would build tis-list-enabled twice.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: tauri-desktop/rust-native
          # Local CLI. The action splits this on spaces, so the path must not contain spaces.
          tauriScript: pnpm --dir ../react-ui exec tauri
          args: ${{ env.TAURI_BUILD_ARGS }}
          uploadWorkflowArtifacts: true

      # Stable names for releases/latest/download. The .app directory is not a
      # release asset (tauri-action would try to upload it as a file).
      - name: Stage installer for the GitHub Release
        shell: bash
        run: |
          set -eu
          shopt -s failglob
          mkdir -p release-assets
          bundle_root="tauri-desktop/rust-native/target"
          if [ -n "${TAURI_TARGET}" ]; then
            bundle_root="${bundle_root}/${TAURI_TARGET}"
          fi
          bundle_root="${bundle_root}/release/bundle"
          # macOS の更新本体は DMG とは別の .app.tar.gz。Linux / Windows は
          # 直前にコピーしたインストーラそのものに署名が付くので .sig だけ足す。
          # 署名はファイル内容に対するもので、配布名へのリネームでは無効にならない。
          # https://v2.tauri.app/plugin/updater/
          copy_updater() {
            local dir="$1"
            local glob="$2"
            local dest="$3"
            local include_bundle="$4"
            local matches=()
            shopt -s nullglob
            matches=( "${dir}"/${glob} )
            shopt -u nullglob
            if [ "${#matches[@]}" -eq 0 ]; then
              return 0
            fi
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected one updater artifact matching ${dir}/${glob}" >&2
              exit 1
            fi
            if [ ! -f "${matches[0]}.sig" ]; then
              return 0
            fi
            if [ "${include_bundle}" = "bundle" ]; then
              cp "${matches[0]}" "release-assets/${dest}"
            fi
            cp "${matches[0]}.sig" "release-assets/${dest}.sig"
          }

          case "${RUNNER_OS}" in
            macOS)
              cp "${bundle_root}/dmg/ReadyType_"*.dmg \
                "release-assets/${INSTALLER_NAME}"
              copy_updater "${bundle_root}/macos" "*.app.tar.gz" "${INSTALLER_NAME%.dmg}.app.tar.gz" bundle
              ;;
            Linux)
              cp "${bundle_root}/appimage/ReadyType_"*.AppImage \
                "release-assets/${INSTALLER_NAME}"
              copy_updater "${bundle_root}/appimage" "*.AppImage" "${INSTALLER_NAME}" sig
              ;;
            Windows)
              cp "${bundle_root}/nsis/ReadyType_"*-setup.exe \
                "release-assets/${INSTALLER_NAME}"
              copy_updater "${bundle_root}/nsis" "*-setup.exe" "${INSTALLER_NAME}" sig
              ;;
            *)
              echo "Unsupported runner: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-${{ matrix.installer }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-installer-*
          merge-multiple: true
          path: release-assets

      # Push the tag before creating the release. A release whose target commit
      # changes .github/workflows and has no ref yet needs workflows:write, which
      # GITHUB_TOKEN cannot have (it 404s or 403s). The tag gives that commit a ref.
      # https://github.blog/changelog/2023-11-02-github-actions-enforcing-workflow-scope-when-creating-a-release/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="$(jq -r .version tauri-desktop/rust-native/tauri.conf.json)"
          tag="app-v${version}"
          title="ReadyType ${version}"
          notes="$(cat <<EOF
          デスクトップ版のインストーラです。

          - macOS（Apple Silicon）: ReadyType-aarch64.dmg
          - macOS（Intel）: ReadyType-x64.dmg
          - Windows: ReadyType-x64-setup.exe
          - Linux: ReadyType-x64.AppImage

          macOS の CI ビルドは ad-hoc 署名です。
          EOF
          )"
          python3 scripts/release/write-updater-manifest.py \
            --version "${version}" \
            --assets-dir release-assets \
            --output release-assets/latest.json \
            --download-base "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          shopt -s nullglob
          binaries=(release-assets/ReadyType-*)
          shopt -u nullglob
          if [ "${#binaries[@]}" -eq 0 ]; then
            echo "No release assets" >&2
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${binaries[@]}" --clobber
            gh release edit "${tag}" --latest --title "${title}" --notes "${notes}"
          else
            gh release create "${tag}" "${binaries[@]}" --latest --title "${title}" --notes "${notes}"
          fi
          if [ -f release-assets/latest.json ]; then
            gh release upload "${tag}" release-assets/latest.json --clobber
          fi
